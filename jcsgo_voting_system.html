<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCSGO Voting System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1e5aa8;
      --blue-dark: #15407a;
      --blue-light: #2b6fc2;
      --yellow: #f5c518;
      --yellow-dark: #d4a80f;
      --yellow-light: #ffe566;
      --white: #ffffff;
      --off-white: #f5f8fc;
      --gray: #e2eaf4;
      --text: #1a2b3c;
      --text-light: #5a6f85;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--off-white);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
      color: var(--white);
      padding: 1rem 2rem;
      box-shadow: 0 4px 20px rgba(30, 90, 168, 0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--yellow);
      background: white;
    }

    nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav-btn {
      background: transparent;
      border: 2px solid transparent;
      color: rgba(255,255,255,0.9);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.12); color: var(--white); }
    .nav-btn.active {
      background: var(--yellow);
      color: var(--blue-dark);
      border-color: var(--yellow);
      font-weight: 600;
    }

    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .section-title { margin-bottom: 1.5rem; }
    .section-title h2 { font-size: 1.75rem; color: var(--blue-dark); margin-bottom: 0.25rem; }
    .section-title p { color: var(--text-light); font-size: 0.95rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(30, 90, 168, 0.1);
      border: 1px solid var(--gray);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(30, 90, 168, 0.15);
      border-color: var(--blue-light);
    }

    .card h3 { font-size: 1.2rem; color: var(--blue-dark); line-height: 1.3; }
    .card .grade-section-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--blue);
      margin-top: -0.4rem;
    }

    .stars {
      display: flex;
      gap: 0.35rem;
      font-size: 1.75rem;
      cursor: pointer;
      user-select: none;
    }

    .star {
      color: #c5d0de;
      transition: color 0.15s, transform 0.15s;
    }

    .star:hover, .star.hover {
      color: var(--yellow-light);
      transform: scale(1.15);
    }

    .star.selected { color: var(--yellow); }

    .rating-label { font-size: 0.8rem; color: var(--text-light); min-height: 1.2em; }

    textarea {
      width: 100%;
      border: 1.5px solid var(--gray);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 0.875rem;
      resize: vertical;
      min-height: 70px;
      transition: border-color 0.2s;
      background: var(--white);
    }

    textarea:focus { outline: none; border-color: var(--blue); }

    .submit-btn {
      background: var(--blue);
      color: var(--white);
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: auto;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-btn.success { background: #16a34a; opacity: 0.85; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--blue-dark);
      color: white;
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      transition: transform 0.3s ease;
      z-index: 200;
      max-width: 90%;
      text-align: center;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #c53030; }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-light);
      font-size: 0.8rem;
    }

    .name-section {
      background: white;
      padding: 1.25rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(30, 90, 168, 0.1);
      border: 1px solid var(--gray);
      margin-bottom: 1.5rem;
      max-width: 650px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      color: var(--blue-dark);
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid var(--gray);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .input-group input:focus { outline: none; border-color: var(--blue); }

    .vote-counter {
      grid-column: 1 / -1;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--blue);
    }

    @media (max-width: 600px) {
      header { padding: 1rem; }
      .logo { font-size: 1.05rem; }
      .nav-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      main { padding: 1.5rem 1rem 3rem; }
      .name-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <img class="logo-badge" src="jca.jpg" alt="JCSGO Christian Academy Logo">
        <span>JCSGO Voting System</span>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-grade="Grade 11">Grade 11</button>
        <button class="nav-btn" data-grade="Grade 12">Grade 12</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="section-title">
      <h2 id="grade-title">Senior High — Grade 11</h2>
      <p>Rate the prototypes below using 1–5 stars. You may vote up to 3 sections total.</p>
    </div>

    <div class="name-section">
      <div class="input-group">
        <label for="voter-name">Enter Full Name</label>
        <input type="text" id="voter-name" placeholder="e.g. Juan Dela Cruz" maxlength="40" autocomplete="off">
      </div>
      <div class="input-group">
        <label for="voter-grade-section">Grade &amp; Section</label>
        <input type="text" id="voter-grade-section" placeholder="e.g. 11 - Selah" maxlength="30" autocomplete="off">
      </div>
      <div class="vote-counter" id="vote-counter">Votes used: 0 / 3</div>
    </div>

    <div class="cards" id="cards"></div>
  </main>

  <footer>© JCSGO Christian Academy — Voting &amp; Rating System</footer>
  <div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd-qNHU-Tamo2JoBFrLJEGJG2lHuKmsSMSi8bw-oTkp8hx7yOtujfktEzUB-Im4EiU/exec';
  const MAX_VOTES = 3;

  const DATA = {
    'Grade 11': [
      { id: 'g11-selah',   title: 'Water-Efficient Irrigation System', gradeSection: '11 - Selah' },
      { id: 'g11-shiloh',  title: 'Gas Monitor', gradeSection: '11 - Shiloh' }
    ],
    'Grade 12': [
      { id: 'g12-jireh',   title: 'Earthquake Alert System', gradeSection: '12 - Jireh' },
      { id: 'g12-rohi',    title: 'EcoHydrate Smart Dispenser', gradeSection: '12 - Rohi' },
      { id: 'g12-rapha',   title: 'Smart Surveillance System', gradeSection: '12 - Rapha' }
    ]
  };

  const TITLES = {
    'Grade 11': 'Senior High — Grade 11',
    'Grade 12': 'Senior High — Grade 12'
  };

  let currentGrade = 'Grade 11';
  const ratings = {};

  function getVoterName() {
    return document.getElementById('voter-name').value.trim();
  }

  function getVoterGradeSection() {
    return document.getElementById('voter-grade-section').value.trim();
  }

  function getUserVotesKey(name) {
    return 'jcsgo_votes_' + name.trim().toLowerCase();
  }

  function getVotedSections(name) {
    if (!name) return [];
    try {
      const stored = localStorage.getItem(getUserVotesKey(name));
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  }

  function hasVoted(name, itemId) {
    return getVotedSections(name).includes(itemId);
  }

  function getVoteCount(name) {
    return getVotedSections(name).length;
  }

  function markVoted(name, itemId) {
    const voted = getVotedSections(name);
    if (!voted.includes(itemId)) {
      voted.push(itemId);
      localStorage.setItem(getUserVotesKey(name), JSON.stringify(voted));
    }
  }

  function updateVoteCounterUI() {
    const name = getVoterName();
    const count = getVoteCount(name);
    const counterEl = document.getElementById('vote-counter');
    if (counterEl) {
      counterEl.textContent = `Votes used: ${count} / ${MAX_VOTES}`;
    }
  }

  function renderCards() {
    const container = document.getElementById('cards');
    document.getElementById('grade-title').textContent = TITLES[currentGrade];
    container.innerHTML = '';

    const name = getVoterName();
    const voteCount = getVoteCount(name);
    const limitReached = name && voteCount >= MAX_VOTES;

    updateVoteCounterUI();

    DATA[currentGrade].forEach(item => {
      if (!ratings[item.id]) {
        ratings[item.id] = { rating: 0, comment: '' };
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;

      const starsHtml = [1, 2, 3, 4, 5].map(n =>
        `<span class="star" data-value="${n}">★</span>`
      ).join('');

      card.innerHTML = `
        <h3>${item.title}</h3>
        <div class="grade-section-tag">${item.gradeSection}</div>
        <div class="stars" data-id="${item.id}">${starsHtml}</div>
        <div class="rating-label" id="label-${item.id}">Select a rating</div>
        <textarea placeholder="Optional feedback..." id="comment-${item.id}">${ratings[item.id].comment || ''}</textarea>
        <button class="submit-btn" data-id="${item.id}" disabled>Submit Rating</button>
      `;

      container.appendChild(card);
      updateStarsUI(item.id);
      updateSubmitState(item.id);

      const btn = card.querySelector('.submit-btn');
      if (name && hasVoted(name, item.id)) {
        btn.disabled = true;
        btn.textContent = 'Already Voted';
        btn.classList.add('success');
      } else if (limitReached) {
        btn.disabled = true;
        btn.textContent = 'Vote Limit Reached (3/3)';
      }
    });

    attachStarEvents();
    attachSubmitEvents();
    attachCommentEvents();
  }

  function updateStarsUI(id) {
    const stars = document.querySelectorAll(`.stars[data-id="${id}"] .star`);
    const value = ratings[id].rating;

    stars.forEach(star => {
      const number = Number(star.dataset.value);
      star.classList.toggle('selected', number <= value && value > 0);
    });

    const label = document.getElementById('label-' + id);
    if (label) {
      label.textContent = value > 0
        ? value + ' star' + (value > 1 ? 's' : '')
        : 'Select a rating';
    }
  }

  function updateSubmitState(id) {
    const btn = document.querySelector(`.submit-btn[data-id="${id}"]`);
    const name = getVoterName();
    if (!btn) return;

    if (name && hasVoted(name, id)) {
      btn.disabled = true;
      return;
    }
    if (name && getVoteCount(name) >= MAX_VOTES) {
      btn.disabled = true;
      return;
    }
    btn.disabled = ratings[id].rating < 1;
  }

  function attachStarEvents() {
    document.querySelectorAll('.stars').forEach(group => {
      const id = group.dataset.id;
      const stars = group.querySelectorAll('.star');

      stars.forEach(star => {
        star.addEventListener('mouseenter', function() {
          const value = Number(star.dataset.value);
          stars.forEach(s => {
            s.classList.toggle('hover', Number(s.dataset.value) <= value);
          });
        });

        star.addEventListener('mouseleave', function() {
          stars.forEach(s => s.classList.remove('hover'));
        });

        // Click to select, click same star again to unselect
        star.addEventListener('click', function() {
          const clicked = Number(star.dataset.value);
          ratings[id].rating = (ratings[id].rating === clicked) ? 0 : clicked;
          updateStarsUI(id);
          updateSubmitState(id);
        });
      });
    });
  }

  function attachCommentEvents() {
    document.querySelectorAll('textarea[id^="comment-"]').forEach(ta => {
      ta.addEventListener('input', function() {
        const id = ta.id.replace('comment-', '');
        ratings[id].comment = ta.value;
      });
    });
  }

  function generateRequestId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'vote_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
  }

  function checkVoteStatus(requestId) {
    return new Promise((resolve, reject) => {
      const callbackName = '__voteStatus_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
      const script = document.createElement('script');
      let finished = false;

      function cleanup() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        clearTimeout(timeout);
      }

      function finish(cb, value) {
        if (finished) return;
        finished = true;
        cleanup();
        cb(value);
      }

      window[callbackName] = result => finish(resolve, result);
      script.onerror = () => finish(reject, new Error('Could not check server status.'));

      const timeout = setTimeout(() => finish(reject, new Error('Server status check timed out.')), 5000);

      const url = new URL(SCRIPT_URL);
      url.searchParams.set('action', 'status');
      url.searchParams.set('requestId', requestId);
      url.searchParams.set('callback', callbackName);
      url.searchParams.set('_', Date.now());

      script.src = url.toString();
      document.body.appendChild(script);
    });
  }

  async function waitForVoteStatus(requestId) {
    for (let attempt = 0; attempt < 20; attempt++) {
      try {
        const result = await checkVoteStatus(requestId);
        if (result.status === 'success') return result;
        if (result.status === 'error') throw new Error(result.message || 'Vote was rejected.');
      } catch (error) {
        if (error.message &&
            error.message !== 'Could not check server status.' &&
            error.message !== 'Server status check timed out.') {
          throw error;
        }
      }
      await new Promise(r => setTimeout(r, 800));
    }
    throw new Error('The server did not confirm your vote. Please check your connection before trying again.');
  }

  async function sendVote(payload) {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await waitForVoteStatus(payload.requestId);
  }

  async function submitRating(id, btn) {
    const item = DATA[currentGrade].find(section => section.id === id);
    if (!item || ratings[id].rating < 1) return;

    const name = getVoterName();
    const voterGradeSection = getVoterGradeSection();

    if (!name) {
      showToast('Please enter your full name first.', true);
      document.getElementById('voter-name').focus();
      return;
    }
    if (!voterGradeSection) {
      showToast('Please enter your grade and section.', true);
      document.getElementById('voter-grade-section').focus();
      return;
    }
    if (hasVoted(name, id)) {
      showToast('You have already voted for this section.', true);
      renderCards();
      return;
    }
    if (getVoteCount(name) >= MAX_VOTES) {
      showToast('You have already reached the maximum of 3 votes.', true);
      renderCards();
      return;
    }

    const payload = {
      requestId: generateRequestId(),
      name: name,
      voterGradeSection: voterGradeSection,
      grade: currentGrade,
      item: `${item.title} (${item.gradeSection})`,
      sectionId: item.id,
      rating: ratings[id].rating,
      comment: ratings[id].comment || ''
    };

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const result = await sendVote(payload);
      if (result.status !== 'success') {
        throw new Error(result.message || 'Submission failed.');
      }

      markVoted(name, id);
      showToast(`Vote recorded! (${getVoteCount(name)}/${MAX_VOTES} votes used)`);

      ratings[id] = { rating: 0, comment: '' };
      renderCards();
    } catch (error) {
      console.error('Voting error:', error);
      btn.disabled = false;
      btn.textContent = 'Submit Rating';
      btn.classList.remove('success');
      showToast(error.message || 'Could not save your rating. Please try again.', true);
    }
  }

  function attachSubmitEvents() {
    document.querySelectorAll('.submit-btn').forEach(btn => {
      btn.addEventListener('click', () => submitRating(btn.dataset.id, btn));
    });
  }

  function showToast(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }

  document.getElementById('voter-name').addEventListener('input', renderCards);

  document.getElementById('nav').addEventListener('click', e => {
    const btn = e.target.closest('.nav-btn');
    if (!btn) return;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGrade = btn.dataset.grade;
    renderCards();
  });

  renderCards();
</script>
</body>
</html>
